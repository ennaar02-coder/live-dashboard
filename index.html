<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchDesk Exchange</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5a3d3d">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #5a3d3d;
            text-align: center;
        }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MatchDesk Exchange</h1>
        <div class="card">
            <h3>Live Dashboard</h3>
            <p>Status: Connected & Operational</p>
        </div>
    </div>
</body>
</html>
